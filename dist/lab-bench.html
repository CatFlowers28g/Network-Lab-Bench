/* ---------- validation (for generated and imported labs) ---------- */

const str = (v,max=4000) => typeof v==="string" ? v.slice(0,max) : (typeof v==="number" ? String(v) : "");
const strArr = (a,max=400) => Array.isArray(a) ? a.map(x=>str(x,max)).filter(x=>x.trim()) : [];
function vChoice(t){
  const options = strArr(t.options).slice(0,8);
  let ans = Array.isArray(t.answer) ? t.answer : [t.answer];
  ans = [...new Set(ans.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<options.length))];
  if (options.length<2 || !ans.length) return null;
  return {prompt:str(t.prompt,600)||"Choose the best answer.", options, answer:ans, multi:!!t.multi || ans.length>1};
}
function validateTask(t){
  if (!t || typeof t!=="object") return null;
  const base = {type:t.type, prompt:str(t.prompt,600), explanation:str(t.explanation,1500)};
  if (t.type==="choice"){ const c=vChoice(t); return c ? {...base,...c,type:"choice"} : null; }
  if (t.type==="net"){ let n=null; try{ n = validateNet(t); }catch(e){ n = null; } return n ? {...base,...n,type:"net"} : null; }
  if (t.type==="wifi"){ let n=null; try{ n = validateWifi(t); }catch(e){ n = null; } return n ? {...base,...n,type:"wifi"} : null; }
  if (t.type==="match"){
    const targets = [...new Set(strArr(t.targets,160))].slice(0,10);
    const items = (Array.isArray(t.items)?t.items:[]).map(i=>({text:str(i&&i.text,200), target:str(i&&i.target,160)})).filter(i=>i.text && targets.includes(i.target)).slice(0,14);
    return targets.length>=2 && items.length>=2 ? {...base,targets,items} : null;
  }
  if (t.type==="order"){ const items=strArr(t.items,300).slice(0,12); return items.length>=3 ? {...base,items} : null; }
  if (t.type==="fill"){
    const columns = strArr(t.columns,60).slice(0,8);
    let fields = 0;
    const rows = (Array.isArray(t.rows)?t.rows:[]).slice(0,20).map(r => (Array.isArray(r)?r:[]).slice(0,8).map(cell=>{
      if (cell && typeof cell==="object"){
        const answer = strArr(Array.isArray(cell.answer)?cell.answer:[cell.answer],120);
        if (!answer.length) return "";
        const options = strArr(cell.options,120).slice(0,12);
        fields++;
        if (options.length>=2 && options.some(o=>answer.map(norm).includes(norm(o)))) return {answer, options};
        return {answer};
      }
      return str(cell,200);
    }));
    return fields ? {...base,columns,rows} : null;
  }
  if (t.type==="cli"){
    const commands = (Array.isArray(t.commands)?t.commands:[]).map(c=>({cmd:strArr(Array.isArray(c&&c.cmd)?c.cmd:[c&&c.cmd],120), output:str(c&&c.output,6000), startsWith:str(c&&c.startsWith,60)})).filter(c=>c.cmd.length||c.startsWith).slice(0,30);
    const question = vChoice(t.question||{});
    if (!commands.length || !question) return null;
    const shell = ["windows","linux","cisco"].includes(t.shell)?t.shell:"windows";
    const promptText = str(t.promptText,40) || ({windows:"C:\\>",linux:"tech@host:~$",cisco:"Router#"})[shell];
    return {...base,shell,promptText,intro:str(t.intro,500),commands,question};
  }
  return null;
}
function validateLab(raw){
  if (!raw || typeof raw!=="object") throw new Error("That isn't a lab object.");
  const lab = {
    id: /^[A-Za-z0-9_-]{1,60}$/.test(raw.id||"") && !String(raw.id).startsWith("b-") && !String(raw.id).startsWith("gen-") ? raw.id : newId(),
    title: str(raw.title,120) || "Untitled lab",
    domain: DOMAIN_IDS.includes(raw.domain) ? raw.domain : "concepts",
    objective: str(raw.objective,120),
    objectives: strArr(raw.objectives,8).filter(o=>OBJECTIVES[o]).concat((str(raw.objective,8).match(/^\d\.\d/)||[]).filter(o=>OBJECTIVES[o])).filter((v,i,a)=>a.indexOf(v)===i),
    difficulty: [1,2,3].includes(Number(raw.difficulty)) ? Number(raw.difficulty) : 2,
    scenario: str(raw.scenario,2500), exhibit: str(raw.exhibit,8000), source:"mine", tasks:[]
  };
  for (const t of (Array.isArray(raw.tasks)?raw.tasks:[]).slice(0,6)){ const v=validateTask(t); if (v) lab.tasks.push(v); }
  if (!lab.tasks.length) throw new Error("The lab has no usable tasks.");
  return lab;
}
const safeValidate = r => { try { return validateLab(r); } catch(e){ return null; } };


/* ---- sims: keep the data, cap sizes, then let the engine prove it starts broken and the solution works ---- */
function capJson(o, depth){ if (depth>8) return null; if (Array.isArray(o)) return o.slice(0,60).map(x=>capJson(x, depth+1)); if (o && typeof o==="object"){ const r = {}; for (const [k,v] of Object.entries(o).slice(0,60)) if (!/^_/.test(k)) r[k.slice(0,40)] = capJson(v, depth+1); return r; } if (typeof o==="string") return o.slice(0,400); if (typeof o==="number" || typeof o==="boolean" || o===null) return o; return null; }
function validateNet(t){
  const devices = capJson(Array.isArray(t.devices) ? t.devices.slice(0,14) : [], 0).filter(d=>d && NET_KINDS.includes(d.kind) && /^[A-Za-z0-9_-]{1,30}$/.test(String(d.id)));
  const ids = new Set(devices.map(d=>d.id)); if (ids.size!==devices.length || devices.length<2) return null;
  devices.forEach(d=>{ d.name = str(d.name,30)||d.id; d.x = Math.max(0,Math.min(100,Number(d.x)||0)); d.y = Math.max(0,Math.min(100,Number(d.y)||0)); if (d.kind==="cloud") d.editable = false; });
  const links = (Array.isArray(t.links)?t.links:[]).slice(0,40).map(l=>Array.isArray(l) && l.length>=4 ? [str(l[0],30),str(l[1],30),str(l[2],30),str(l[3],30), l[4] && typeof l[4]==="object" ? capJson(l[4],0) : undefined].filter(x=>x!==undefined) : null).filter(l=>l && ids.has(l[0]) && ids.has(l[2]));
  const goals = capJson((Array.isArray(t.goals)?t.goals:[]).slice(0,10),0).filter(g=>g && ["ping","conn","dhcp","config","dns","perf","state"].includes(g.type)).map(g=>({...g, label:str(g.label,160)||"Requirement"}));
  const solution = capJson((Array.isArray(t.solution)?t.solution:[]).slice(0,24),0).filter(s=>s && (ids.has(s.dev) || Array.isArray(s.link)));
  if (!goals.length || !solution.length) return null;
  const out = {devices, links, goals, solution};
  const chk = checkNetTask(out);
  if (chk.startAllPass || !chk.solvedAllPass) return null;
  return out;
}
function validateWifi(t){
  const aps = capJson(Array.isArray(t.aps)?t.aps.slice(0,10):[],0).filter(a=>a && a.id && ["2.4","5","6"].includes(String(a.band)));
  aps.forEach(a=>{ a.band = String(a.band); a.name = str(a.name,30)||a.id; });
  const clients = capJson(Array.isArray(t.clients)?t.clients.slice(0,10):[],0).filter(c=>c && c.id);
  const neighbors = capJson(Array.isArray(t.neighbors)?t.neighbors.slice(0,6):[],0).filter(Boolean);
  const goals = capJson((Array.isArray(t.goals)?t.goals:[]).slice(0,8),0).filter(g=>g && /^wifi/.test(g.type)).map(g=>({...g, label:str(g.label,160)||"Requirement"}));
  const solution = capJson((Array.isArray(t.solution)?t.solution:[]).slice(0,12),0).filter(s=>s && s.ap && s.set);
  const floor = {w:Math.max(10,Math.min(200,Number(t.floor&&t.floor.w)||50)), h:Math.max(10,Math.min(150,Number(t.floor&&t.floor.h)||30))};
  if (!aps.length || !goals.length || !solution.length) return null;
  const out = {floor, aps, clients, neighbors, goals, solution};
  const chk = checkWifiTask(out);
  if (chk.startAllPass || !chk.solvedAllPass) return null;
  return out;
}

/* Platform adapter: the same app runs inside Claude (capabilities) or standalone (browser storage, your own API key). MIT License. */

const platform = {
  inClaude:false, db:null, user:null, sample:null, downloads:null, ready:false,
  async init(){
    if (typeof window!=="undefined" && window.claude && typeof window.claude.use==="function"){
      this.inClaude = true;
      const get = n => window.claude.use(n).then(x=>x, ()=>null);
      [this.db, this.user, this.sample, this.downloads] = await Promise.all(["db","user","sample","downloads"].map(get));
    }
    this.ready = true;
  },
  setting(k, v){ try{ if (v===undefined) return localStorage.getItem("labbench."+k) || ""; if (v===null) localStorage.removeItem("labbench."+k); else localStorage.setItem("labbench."+k, v); }catch(e){ return ""; } },
  canAsk(){ return !!this.sample || !!this.setting("apikey"); },
  async askJson(prompt, opts){
    opts = opts || {};
    if (this.sample) return this.sample.json(prompt, {signal:opts.signal, cache:false, onText:opts.onText});
    const key = this.setting("apikey");
    if (!key) throw {code:"no_key"};
    let res;
    try{
      res = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", signal:opts.signal,
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:this.setting("model")||"claude-sonnet-5-5", max_tokens:16000, messages:[{role:"user", content:prompt+"\n\nReply with only the JSON, no other text."}]})});
    }catch(e){ throw {code: e && e.name==="AbortError" ? "cancelled" : "network"}; }
    if (!res.ok){ const t = await res.text().catch(()=>""); throw {code: res.status===401 ? "bad_key" : res.status===429 ? "rate_limited" : "upstream_error", message:t.slice(0,200)}; }
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||"").join("");
    if (opts.onText) opts.onText({text});
    const m = text.replace(/```json|```/g,"").match(/[\[{][\s\S]*[\]}]/);
    try{ return JSON.parse(m ? m[0] : text); }catch(e){ throw {code:"invalid_json", text}; }
  },
  async saveFile(filename, text, mime){
    if (this.downloads){ await this.downloads.save({filename, data:text}); return "saved"; }
    if (this.inClaude) throw {code:"unavailable"};
    const blob = new Blob([text], {type:mime||"text/plain"}); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return "saved";
  }
};

const store = {
  uid:null, progress:{labs:{}, obj:{}, srs:{}, lastExport:0, exams:[], quiz:{answered:0, correct:0}}, custom:[], cards:{}, q:Promise.resolve(),
  loadLocal(){
    try{
      const p = JSON.parse(localStorage.getItem("labbench.progress")||"null"); if (p && p.labs) this.progress = Object.assign(this.progress, p);
      const c = JSON.parse(localStorage.getItem("labbench.custom")||"null"); if (Array.isArray(c)) this.custom = c.map(safeValidate).filter(Boolean);
      const k = JSON.parse(localStorage.getItem("labbench.cards")||"null"); if (k && typeof k==="object") this.cards = k;
    }catch(e){}
  },
  saveLocal(){ try{ localStorage.setItem("labbench.progress",JSON.stringify(this.progress)); localStorage.setItem("labbench.custom",JSON.stringify(this.custom)); localStorage.setItem("labbench.cards",JSON.stringify(this.cards)); }catch(e){} },
  enqueue(fn){ this.q = this.q.then(fn).catch(e=>console.warn("Sync failed", e)); return this.q; },
  get db(){ return platform.db && this.uid ? platform.db : null; },
  pref(){ return platform.db.doc(`data/users/${this.uid}/progress`); },
  async connect(){
    if (!platform.db || !platform.user) return;

      const uid = await platform.user.id(); if (!uid) return; this.uid = uid;
      const pref = this.pref();
      const [snap, labsSnap, cardsSnap] = await Promise.all([pref.get(), pref.collection("labs").limit(1000).get(), pref.collection("cards").limit(1000).get()]);
      const cloud = snap.exists ? (snap.data()||{}) : {};
      this.progress = mergeProgress(cloud, this.progress);
      const cloudLabs = labsSnap.docs.map(d=>{ const b = d.data(); const l = b && safeValidate(b.lab); if (l){ l.id = d.id; l.createdAt = b.createdAt; } return l; }).filter(Boolean);
      const ids = new Set(cloudLabs.map(l=>l.id)); const localOnly = this.custom.filter(l=>!ids.has(l.id));
      this.custom = [...cloudLabs.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)), ...localOnly];
      const cc = {}; for (const d of cardsSnap.docs){ const b = d.data(); if (b && b.front) cc[d.id] = {...b}; }
      const push = []; for (const [id,c] of Object.entries(this.cards)) if (!cc[id] || (c.updatedAt||0) > (cc[id].updatedAt||0)){ cc[id] = c; push.push(id); }
      this.cards = cc;
      this.saveLocal();
      this.saveProgress();
      for (const l of localOnly) this.enqueue(()=>pref.collection("labs").doc(l.id).set({lab:clone(l), createdAt:l.createdAt||Date.now()}));
      this.pushCards(push);
      if (ui.view==="home") render();
    }catch(e){ console.warn("Sync unavailable", e); this.uid = null; }
  },
  saveProgress(){ this.saveLocal(); if (this.db){ const data = clone(this.progress); this.enqueue(()=>this.pref().set(data)); } },
  objPush(o, v){ if (!OBJECTIVES[o]) return; const r = this.progress.obj[o] = this.progress.obj[o] || {hist:[], n:0}; r.hist.push(Math.round(v*100)/100); if (r.hist.length>30) r.hist = r.hist.slice(-30); r.n++; },
  recordLab(lab, score){

    this.progress.labs[lab.id] = {attempts:r.attempts+1, best:Math.max(r.best||0,score), last:score, at:Date.now(), domain:lab.domain};
    for (const o of labObjectives(lab)){ this.objPush(o, score/100); this.objPush(o, score/100); }
    this.saveProgress();
  },
  recordQuestion(q, correct, noSave){
    this.objPush(q.obj, correct?1:0);
    this.progress.quiz.answered++; if (correct) this.progress.quiz.correct++;
    if (q.key) this.progress.srs[q.key] = srsUpdate(this.progress.srs[q.key], correct, Date.now());

  },
  recordExam(rec){ this.progress.exams = [rec, ...(this.progress.exams||[])].slice(0,20); this.saveProgress(); },
  addLab(lab){ lab.createdAt = Date.now(); this.custom.unshift(lab); this.saveLocal(); if (this.db) this.enqueue(()=>this.pref().collection("labs").doc(lab.id).set({lab:clone(lab), createdAt:lab.createdAt})); },
  deleteLab(id){ this.custom = this.custom.filter(l=>l.id!==id); delete this.progress.labs[id]; this.saveProgress(); if (this.db) this.enqueue(()=>this.pref().collection("labs").doc(id).delete()); },
  pushCards(ids){ if (!this.db) return; for (const id of ids){ const c = this.cards[id], ref = this.pref().collection("cards").doc(id), data = c ? clone(c) : null; this.enqueue(()=> data ? ref.set(data) : ref.delete()); } },
  trackCards(src, misses, hits){
    const now = Date.now(), changed = [];

      if (c){ c.misses++; c.streak = 0; c.lastMissed = now; c.updatedAt = now; if (!c.improved){ c.front = m.front; c.back = m.back; c.extra = m.extra; c.context = m.context; } }
      else this.cards[id] = {id, labId:src.id, labTitle:src.title, domain:src.domain, objective:m.obj || (labObjectives(src)[0]||""), context:m.context||"", front:m.front, back:m.back, extra:m.extra||"", misses:1, streak:0, lastMissed:now, updatedAt:now, improved:false};
      changed.push(id);
    }

  removeCard(id){ delete this.cards[id]; this.saveLocal(); this.pushCards([id]); },

    for (const [id,c] of Object.entries(d.cards||{})) if (!this.cards[id] || (c.updatedAt||0) > (this.cards[id].updatedAt||0)) this.cards[id] = c;

function mastery(o){

function ankiText(list){
  const lines = ["#separator:Tab","#html:true","#notetype:Basic","#deck:Network+ Weak Spots","#guid column:1","#tags column:4"];
  for (const c of list){
    const front = (c.context ? `<div style="font-size:0.85em;opacity:0.75">${ankiEsc(c.context)}</div><br>` : "") + ankiEsc(c.front);
    const back = ankiEsc(c.back) + (c.extra ? `<br><br><div style="font-size:0.85em">${ankiEsc(c.extra)}</div>` : "")

function cliComp(t, name){
  const out = h("pre",{class:"out", tabindex:"0", "aria-label":"Terminal output"});
  if (t.intro) out.append(h("span",{class:"dim"}, t.intro+"\n\n"));

  const input = h("input",{type:"text","aria-label":"Command", autocomplete:"off", autocapitalize:"off", spellcheck:"false", enterkeyhint:"go"});
  function run(raw){
    const cmd = raw.trim(); if (!cmd) return;
    history.push(cmd); hi = history.length;
    const n = norm(cmd);
    if (n==="clear" || n==="cls"){ put(out); return; }
    out.append(h("span",{class:"cmd"}, t.promptText+" "+cmd+"\n"));
    let res;
    if (n==="help" || n==="?") res = "Available commands:\n" + t.commands.map(c=>"  "+(c.cmd[0]||c.startsWith+"…")).join("\n");
    else {

      if (hit) res = hit.output;
      else if (t.shell==="cisco") res = "% Invalid input detected at '^' marker.";
      else if (t.shell==="linux") res = `${cmd.split(" ")[0]}: command not found (or not available in this lab)`;

    }

    if (e.key==="Enter"){ e.preventDefault(); run(input.value); input.value=""; }
    else if (e.key==="ArrowUp" && history.length){ e.preventDefault(); hi=Math.max(0,hi-1); input.value=history[hi]; }
    else if (e.key==="ArrowDown" && history.length){ e.preventDefault(); hi=Math.min(history.length,hi+1); input.value=history[hi]||""; }

let _pool = null;
const pool = () => _pool || (_pool = questionPool());

function weakWeight(o){ const m = mastery(o); return m==null ? 70 : Math.max(5, 100-m); }
function pickQuestions(scope, n, R){
  const P = pool(); let cand;
  if (scope==="due"){ const keys = new Set(dueKeys()); cand = P.filter(p=>p.key && keys.has(p.key)); if (!cand.length) cand = P; }
  else if (scope==="acronym") cand = P.filter(p=>p.obj==="acronym");
  else if (String(scope).startsWith("cat:")){ const c = String(scope).slice(4); cand = P.filter(p=>catOfObj(p.obj)===c); if (!cand.length) cand = P.filter(p=>p.obj!=="acronym"); }
  else if (OBJECTIVES[scope]) cand = P.filter(p=>p.obj===scope);
  else if (DOMAIN_WEIGHT[scope]) cand = P.filter(p=>DOMAIN_OF(p.obj)===scope);
  else cand = P.filter(p=>p.obj!=="acronym");
  const out = [], used = new Set();
  for (let k=0; k<n*6 && out.length<n; k++){
    let p;
    if (scope==="weak"){ const tot = cand.reduce((s,x)=>s+weakWeight(x.obj),0); let r = R.f()*tot; p = cand.find(x=>(r -= weakWeight(x.obj)) <= 0) || cand[0]; }
    else if (scope==="due") p = cand[out.length % cand.length];
    else p = R.pick(cand);
    const q = p.make(R); const id = q.key && !p.generated ? q.key : q.prompt;
    if (used.has(id)) continue; used.add(id); out.push(q);
  }
  return out;
}

function genPrompt(g){
  const d = dom(g.domain);
  const existing = allLabEntries().filter(e=>e.domain===g.domain).map(e=>e.title).slice(0,40);
  const typeRule = g.type==="any" ? "Choose the task types that best fit the topic and favor hands-on work: for routing, switching, addressing, DHCP, DNS and connectivity troubleshooting use a \"net\" simulation; for diagnosis from command output use \"cli\"; mix in other types as follow-ups." : `Every lab must center on a "${g.type}" task (you may add one short "choice" follow-up task).`;
  return `You write CompTIA Network+ (N10-009) performance-based practice labs, like exam PBQs, for a learner who passed the exam and wants hands-on retention practice.

Create ${g.count} lab${g.count>1?"s, each on a different topic":""}.
Domain: ${d.name}. Topics in this domain: ${d.hint}.${g.obj ? `
Objective: N10-009 ${g.obj} ${OBJECTIVES[g.obj]}. Every lab must target this objective and set "objective" to "${g.obj}".` : ""}
Topic focus: ${g.topic.trim() ? g.topic.trim().slice(0,200) : "pick a high-yield topic from this domain that isn't already covered by the existing titles below"}.
${typeRule}
Difficulty: ${g.difficulty} (1 = recall, 2 = applied workplace scenario, 3 = multi-step troubleshooting with plausible distractors).
Existing lab titles to avoid duplicating: ${existing.join("; ") || "none"}.

Reply with only JSON in this shape: {"labs":[LAB, ...]}

LAB = {"title": short title, "objective": "N10-009 objective number and name, e.g. 2.2 Switching technologies", "difficulty": 1|2|3, "scenario": "2-4 sentence realistic workplace scenario", "exhibit": "optional monospace exhibit (wire map, config, log, table) using \\n line breaks; omit if not needed", "tasks": [TASK, ...] (1-4 tasks)}

TASK is one of:
{"type":"match","prompt":"...","targets":["bucket label", ...],"items":[{"text":"...","target":"exact bucket label"}],"explanation":"..."}
{"type":"order","prompt":"...","items":["step in CORRECT order", ...],"explanation":"..."}
{"type":"fill","prompt":"...","columns":["header", ...],"rows":[[CELL, ...], ...],"explanation":"..."}
  CELL = "fixed text" | {"answer":"x"} or {"answer":["x","accepted alternative"]} for a typed box | {"answer":"x","options":["x","y","z"]} for a dropdown (answer must be one of the options)
{"type":"choice","prompt":"...","options":["...","...","...","..."],"answer":[0-based index, ...],"multi":false,"explanation":"..."}
{"type":"net", ...see NET below...}
{"type":"wifi", ...see WIFI below...}
{"type":"cli","prompt":"...","shell":"windows"|"linux"|"cisco","promptText":"e.g. C:\\\\Users\\\\tech> or tech@web01:~$ or R1#","intro":"optional banner","commands":[{"cmd":["exact command","common variant or abbreviation", ...],"output":"realistic output"}],"question":{"prompt":"...","options":["...","...","...","..."],"answer":[index],"multi":false},"explanation":"..."}

Rules:
- Every fact must be correct for N10-009, and every graded answer must be unambiguous. If more than one answer would be valid, list all of them as alternatives or rewrite the task.
- match: 5-10 items and 3-7 targets; extra distractor targets are welcome. Each item's target must exactly equal one of the targets strings.
- order: 4-8 items.
- fill: typed answers must be short (IP addresses, masks, prefix lengths, numbers, VLAN IDs, single words). Use dropdowns for anything wordy or with multiple valid spellings. 3-12 answer cells. Every row has the same number of cells as columns.
- cli: 6-12 commands whose realistic output contains the evidence needed, including some commands that rule out wrong answers. Include common abbreviations as variants. Don't reveal the answer in the scenario.
- choice: exactly 4 options; set multi true only if the prompt says how many to select.
- Explanations: 1-3 sentences that teach why, including why tempting wrong answers are wrong.
- Plain text only, no markdown.

NET is a live network simulation the learner configures by clicking devices, with real ping/ipconfig/nslookup/tracert on hosts and show commands on switches and routers. Grading checks whether the network actually works.
{"type":"net","prompt":"Make every requirement pass.","devices":[DEVICE,...],"links":[["devId","port","devId","port"],...],"goals":[GOAL,...],"solution":[STEP,...],"explanation":"..."}
DEVICE (x and y are 0-100 diagram positions; put the internet/router at the top and hosts at y 90-95; "editable": false locks a device):
 host: {"id":"pc1","kind":"pc"|"laptop"|"server"|"printer","name":"PC-1","x":10,"y":94,"editable":true,"mode":"static"|"dhcp","ip":"","mask":"","gw":"","dns":""}
   a DNS server host also has "dnsRecords":{"name":"ip"} and optionally "forwarder":"8.8.8.8"; a DHCP server host also has "dhcp":[{"network":"192.168.30.0/24","start":"192.168.30.100","gw":"192.168.30.1","dns":"192.168.10.5"}]
 switch: {"id":"sw1","kind":"switch","name":"SW1","x":50,"y":50,"editable":true,"vlanNames":{"10":"STAFF"},"ports":[{"name":"Gi0/1","mode":"access"|"trunk","vlan":10,"allowed":"all" or "10,20","shutdown":false}]}
 router (at most one): {"id":"r1","kind":"router","name":"R1","x":50,"y":5,"editable":true,"ifaces":[{"name":"Gi0/0.10","vlan":10 or null,"ip":"","mask":"","helper":""}],"defaultRoute":""}
 internet: {"id":"isp","kind":"cloud","name":"Internet","x":90,"y":4,"ip":"203.0.113.1","records":{"comptia.org":"198.51.100.24"}}
Links: a host's port is "NIC", the cloud's is "WAN", a router's is the physical interface (subinterface Gi0/0.10 rides on Gi0/0), and switch ports must exist in that switch's ports list. Each host has exactly one link.
GOAL: {"type":"ping","from":"pc1","to":"IP or DNS name","expect":true,"label":"..."} | {"type":"dhcp","host":"pc2","label":"..."} | {"type":"config","dev":"pc1","field":"ip"|"mask"|"gw"|"dns","equals":["accepted value", ...],"label":"..."}
STEP (one working fix): {"dev":"sw1","port":"Gi0/3","set":{"vlan":20}} | {"dev":"sw1","port":"Gi0/24","set":{"mode":"trunk","allowed":"10,20"}} | {"dev":"r1","iface":"Gi0/0.20","set":{"ip":"192.168.20.1","mask":"255.255.255.0"}} | {"dev":"r1","iface":"Gi0/0.30","set":{"helper":"192.168.10.5"}} | {"dev":"r1","set":{"defaultRoute":"203.0.113.1"}} | {"dev":"srv","pool":0,"set":{"gw":"192.168.30.1"}} | {"dev":"pc2","set":{"gw":"192.168.1.1"}}
How the simulator behaves: hosts need a valid IP, mask and gateway, and the replying device needs a working path back too. Access ports carry one VLAN untagged; trunks carry their allowed VLANs tagged, with VLAN 1 untagged as native; both ends of a trunk must allow a VLAN. A router subinterface with vlan N works over a trunk allowing N; an untagged router interface plugs into an access port. The router routes between its connected subnets and sends everything else to defaultRoute, which must be the cloud's ip on a connected subnet; public IPs are then reachable. DHCP works on the DHCP server's own subnet, or for another subnet via that router interface's helper address; with no lease a client gets 169.254.x.x. DNS: hosts query their dns server, which answers from dnsRecords or asks its forwarder over the internet, where the cloud answers from its records.
Every net task is verified automatically before it's saved: at least one goal must FAIL in the starting configuration, and applying the solution steps must make EVERY goal pass. Plant 1-3 realistic faults (wrong gateway, wrong mask, port in the wrong VLAN, access port where a trunk is needed, VLAN missing from a trunk's allowed list, shut-down port, missing helper address, wrong DHCP scope option, missing default route, wrong DNS server). Use 3-8 devices. Lock devices the learner shouldn't touch. Don't reveal the faults in the scenario; describe symptoms.
More sim features you may use: switch ports also take speed ("auto","100","1000"), duplex ("auto","full","half"), mtu, voice (voice VLAN), native, sfp ("1000BASE-SX","1000BASE-LX","10GBASE-SR","10GBASE-LR"), poe (bool), trusted (bool), portSecurity {enabled,max,violation}, channel (number) and lacp ("on","active","passive"); a switch takes stp {enabled, priority}, dhcpSnooping, dai, poeStd ("af","at","bt") and poeBudget; links take a 5th element {cable:"cat3"|"cat5e"|"cat6"|"smf"|"mmf", length}; kind "l3switch" has ports plus ifaces named "Vlan10" with vlan 10 (SVIs); routers take routes [{net, via, ad}], ospf {enabled, area, passive:[]}, acls {NAME:[{action:"permit"|"deny", proto:"ip"|"icmp"|"tcp"|"udp", src, dst, port}]}, and ifaces take acl (inbound list name), nat ("inside"|"outside"), vip and vipPriority (FHRP); hosts take services ["tcp/443"], hosts {name:ip} (hosts file), fw {enabled, rules:[{action:"allow", proto, port, src}]}, os ("windows"|"linux"), zone [{name,type,value}] for DNS servers, and dhcp scopes may include end, exclusions [], reservations [{mac, ip}]. Goal types also include {"type":"conn","from","to","proto":"tcp","port":443}, {"type":"dns","from","name","rtype":"A","value"}, {"type":"perf","from","to","minMbps"}, and {"type":"state","check":"root"|"noStorm"|"portUp"|"powered"|"bundle"|"noVlanHop"|"macSafe"|"arpSafe"|"unusedDown"|"route", "dev", ...}. Solution steps may also be {"dev","acl":"NAME","rules":[...]}, {"dev","routes":[...]}, {"dev","zone":[...]} or {"link":["devId","port"],"set":{"cable":"cat6"}}.

WIFI is a floor-plan wireless lab graded by a simple model (coverage radius by band and power; channels overlap if their frequency blocks overlap; DFS is 5 GHz channels 52 to 144):
{"type":"wifi","prompt":"...","floor":{"w":meters,"h":meters},"aps":[{"id","name","x","y","band":"2.4"|"5"|"6","channel","width":20|40|80|160,"power":"low"|"medium"|"high","ssid","security":"open"|"owe"|"wpa2-psk"|"wpa2-ent"|"wpa3-sae"|"wpa3-ent","antenna":"omni"|"directional","heading":0,"enabled":true,"captivePortal":false,"bandSteering":false}],"clients":[{"id","name","x","y","bands":["2.4","5"],"security":[...supported],"ssid","path":[[x,y],...] (optional)}],"goals":[{"type":"wifiClient","client","minRssi":-67,"band"?} | {"type":"wifiNoOverlap"} | {"type":"wifiNoDfs"} | {"type":"wifiRoam","client"} | {"type":"wifiLink","a","b"} | {"type":"wifiConfig","ap","field","equals":[...]}],"solution":[{"ap":"id","set":{...}}],"explanation":"..."}
Wifi labs are verified the same way: at least one goal fails at the start and the solution makes all pass.`;
}
async function generate(){
  const g = ui.gen;
  if (!platform.canAsk() || g.busy) return;
  g.busy = true; g.err = false; g.status = "Thinking… this usually takes 20 to 60 seconds."; g.added = [];
  g.ctl = new AbortController();
  render();
  try{
    const res = await platform.askJson(genPrompt(g), {signal:g.ctl.signal,
      onText:({text})=>{ g.status = `Writing lab${g.count>1?"s":""}… ${text.length.toLocaleString()} characters`; const s=document.querySelector(".status"); if (s) s.textContent = g.status; }});
    const arr = Array.isArray(res) ? res : (res && Array.isArray(res.labs) ? res.labs : [res]);
    let skipped = 0;
    for (const raw of arr){
      if (raw && typeof raw==="object"){ raw.domain = g.domain; if (g.obj && !raw.objective) raw.objective = g.obj; }
      const l = safeValidate(raw);
      if (l){ l.id = newId(); store.addLab(l); g.added.push(l); } else skipped++;
    }
    g.status = g.added.length ? `Added ${g.added.length} lab${g.added.length===1?"":"s"} to My labs${skipped?` (${skipped} came back unusable and was skipped)`:""}.` : "The response didn't contain a usable lab. Try again.";
    g.err = !g.added.length;
  }catch(e){
    const code = e && e.code;
    g.err = code!=="cancelled";
    g.status = errorCopy(code);

  }finally{
    g.busy = false; g.ctl = null; if (ui.view==="home") render();
  }
}

const prefs = () => store.progress.prefs || (store.progress.prefs = {level:0, path:[], at:0});

function levelUpOffer(){

      h("div",{class:"score "+band(s)}, s+"%", h("small",null, s>=85?"Solid. Try a harder one or a new variant.":s>=60?"Close. Read the explanations, then retry.":"Worth another pass after reading the explanations.", run.missCount ? ` ${run.missCount} miss${run.missCount===1?"":"es"} saved to Flashcards.` : "", run.hintsUsed ? ` You used ${run.hintsUsed} hint${run.hintsUsed===1?"":"s"}.` : "")),
      h("div",{class:"row"}, h("button",{class:"btn", onclick:()=>openEntry(run.entry)}, lab.variant ? "New variant" : "Try again"),
        (prefs().path||[]).includes(run.entry.id) || nextInPath() ? (()=>{ const nx = nextInPath(run.score>=85 ? null : run.entry.id); return nx ? h("button",{class:"btn primary", onclick:()=>openEntry(nx)},"Next in my path") : h("button",{class:"btn primary", onclick:()=>openEntry(weakSpotLab())},"Next weak spot"); })()
          : h("button",{class:"btn primary", onclick:()=>openEntry(weakSpotLab())},"Next weak spot"),
        !(prefs().path||[]).includes(run.entry.id) && !run.entry.gen ? h("button",{class:"btn ghost", onclick:()=>{ togglePath(run.entry.id); drawBar(); }},"+ Add to my path") : null));
  }
  function gradeAll(){
    let total = 0; const misses = [], hits = [];
    for (const c of run.comps){
      const s = c.comp.grade(); total += s;
      c.scoreEl.textContent = Math.round(s*100)+"%";
      c.scoreEl.style.color = `var(--${band(Math.round(s*100))==="g"?"ok":band(Math.round(s*100))==="a"?"warn":"bad"})`;
      if (c.t.type!=="net" && c.t.type!=="wifi") put(c.exp, explainBox(c.t) || "");
      else if (c.t.explanation) put(c.exp, h("div",{class:"explain"}, h("b",null,"Why"), c.t.explanation));
      for (const m of c.comp.misses||[]) misses.push({...m, extra:c.t.explanation||"", context: m.context ? lab.scenario||"" : ""});
      hits.push(...(c.comp.hits||[]));
    }
    run.score = Math.round(total/run.comps.length*100);
    run.missCount = misses.length; run.graded = true; run.hintsUsed = run.comps.reduce((s,c)=>s+(c.comp.hintsUsed||0),0);
    store.recordLab(lab, run.score);
    store.trackCards(lab, misses, hits);
    drawBar();
  }
  drawBar();
  const back = h("button",{class:"btn ghost", onclick:()=>{ ui.view="home"; ui.run=null; render(); window.scrollTo(0,0); }}, ui.tab==="path" ? "← My path" : "← All labs");
  const del = run.entry.source==="mine" ? h("button",{class:"btn ghost danger", onclick:()=>{ if (confirm("Delete this lab? Its score history goes too.")){ store.deleteLab(lab.id); ui.view="home"; ui.run=null; render(); } }},"Delete lab") : null;
  return h("div",null,
    h("div",{class:"row", style:"justify-content:space-between"}, back, del),
    h("header",{class:"labhead", style:`border-left-color:${c.color}`},
      h("div",{class:"meta"}, `${c.name} · ${KINDS[kind]} · `, levelTag(lab.difficulty)), h("h2",null, lab.title)),
    lab.scenario ? h("p",{class:"scenario"}, lab.scenario) : null,
    lab.exhibit ? [h("div",{class:"exlabel"},"Exhibit"), h("pre",{class:"exhibit", tabindex:"0"}, lab.exhibit)] : null,
    tasks, bar);
}
/* ---- boot ---- */
store.loadLocal();
render();
platform.init().then(()=>{ store.connect(); if (ui.view==="home") render(); });
</script>
</body>
</html>
